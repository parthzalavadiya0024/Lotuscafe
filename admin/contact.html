<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Messages - LotusCafe</title>

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="stylesheet" href="contact.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<body>

<div class="dashboard">

    <!-- Sidebar -->
    <div class="sidebar">

        <div class="logo">
            <h2>LotusCafe</h2>
            <p>Admin Panel</p>
        </div>

        <ul>

            <li>
                <a href="dashboard.html">
                    <i class="fa-solid fa-house"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="menu-management.html">
                    <i class="fa-solid fa-utensils"></i>
                    Menu
                </a>
            </li>

            <li>
                <a href="orders.html">
                    <i class="fa-solid fa-cart-shopping"></i>
                    Orders
                </a>
            </li>

            <li>
                <a href="reviews.html">
                    <i class="fa-solid fa-star"></i>
                    Reviews
                </a>
            </li>

            <li>
                <a href="customers.html">
                    <i class="fa-solid fa-users"></i>
                    Customers
                </a>
            </li>

            <li class="active">
                <a href="contact.html">
                    <i class="fa-solid fa-envelope"></i>
                    Contact 
                </a>
            </li>

            <li>
                <a href="settings.html">
                    <i class="fa-solid fa-gear"></i>
                    Settings
                </a>
            </li>

            <li>
                <a href="#" id="logoutBtn">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </a>
            </li>

        </ul>

    </div>

    <!-- Main -->

    <div class="main-content">

        <header>
            <h1>Contact Messages</h1>
        </header>

        <div class="table-container">

            <div class="table-header">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchContact" placeholder="Search Contact...">
                </div>
            </div>

            <table>

                <thead>

                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Message</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="contactTable">

                    
                </tbody>

            </table>

            <div class="pagination-container">
            
                <button id="prevPage" class="page-btn">
                    <i class="fa-solid fa-angle-left"></i> Previous
                </button>
            
                <span id="pageInfo"></span>
            
                <button id="nextPage" class="page-btn">
                    Next <i class="fa-solid fa-angle-right"></i>
                </button>
            
            </div>

        </div>

    </div>

</div>

<!-- View Popup -->
<div class="popup" id="viewPopup">
    <div class="popup-content">
        <span class="close" id="closeView">&times;</span>

        <h2>Contact Details</h2>

        <p><b>Name:</b> <span id="popupName"></span></p>
        <p><b>Email:</b> <span id="popupEmail"></span></p>
        <p><b>Phone:</b> <span id="popupPhone"></span></p>
        <p><b>Date:</b> <span id="popupDate"></span></p>

        <p><b>Message:</b></p>
        <p id="popupMessage"></p>
    </div>
</div>

<!-- Delete Popup -->
<div class="popup" id="deletePopup">
    <div class="popup-content">
        <h2>Delete Contact</h2>

        <p>Are you sure you want to delete this contact?</p>

        <div class="popup-buttons">
        <button id="cancelDelete">Cancel</button>
        <button id="confirmDelete">Delete</button>
        </div>
    </div>
</div>

<script>

    // ===== Admin Authentication =====
if (localStorage.getItem("adminLoggedIn") !== "true") {

    history.pushState(null, null, location.href);

    window.addEventListener("popstate", function () {

        history.pushState(null, null, location.href);
        window.location.replace("admin-login.html");

    });

    window.location.replace("admin-login.html");

}

const search = document.getElementById("searchContact");

search.addEventListener("keyup", function(){

    const value = this.value.toLowerCase();

    const rows = document.querySelectorAll("tbody tr");

    rows.forEach(row=>{

        const text = row.innerText.toLowerCase();

        row.style.display =
            text.includes(value) ? "" : "none";

    });

});

const tableBody = document.getElementById("contactTable");

let currentPage = 1;
const rowsPerPage = 10;
let allContacts = [];

let selectedRow = null;

const viewPopup = document.getElementById("viewPopup");
const deletePopup = document.getElementById("deletePopup");

const closeView = document.getElementById("closeView");
const cancelDelete = document.getElementById("cancelDelete");
const confirmDelete = document.getElementById("confirmDelete");

async function loadContacts() {

    try {

        const res = await fetch("http://localhost:5000/api/contact/all");

        const data = await res.json();

        if (!data.success) return;

        tableBody.innerHTML = "";
        allContacts = data.contacts;

const start = (currentPage - 1) * rowsPerPage;
const end = start + rowsPerPage;

        allContacts.slice(start, end).forEach(contact => {
            tableBody.innerHTML += `

            <tr
                data-id="${contact._id}"
                data-name="${contact.name}"
                data-email="${contact.email}"
                data-phone="${contact.phone}"
                data-message="${contact.message}"
                data-date="${new Date(contact.createdAt).toLocaleDateString()}"
            >

                <td>${contact.name}</td>

                <td>${contact.email}</td>

                <td>${contact.phone}</td>

                <td>${contact.message.substring(0,30)}...</td>

                <td>${new Date(contact.createdAt).toLocaleDateString()}</td>

                <td>

                    <button class="view-btn">
                        <i class="fas fa-eye"></i>
                    </button>

                    <button class="delete-btn">
                        <i class="fas fa-trash"></i>
                    </button>

                </td>

            </tr>

            `;

        });

        updatePagination();

    } catch (err) {

        console.log(err);

    }

}

tableBody.addEventListener("click", (e) => {

    // VIEW
    if (e.target.closest(".view-btn")) {

        const row = e.target.closest("tr");

        document.getElementById("popupName").innerText = row.dataset.name;
        document.getElementById("popupEmail").innerText = row.dataset.email;
        document.getElementById("popupPhone").innerText = row.dataset.phone;
        document.getElementById("popupDate").innerText = row.dataset.date;
        document.getElementById("popupMessage").innerText = row.dataset.message;

        viewPopup.style.display = "flex";
    }

    // DELETE
    if (e.target.closest(".delete-btn")) {

        selectedRow = e.target.closest("tr");

        deletePopup.style.display = "flex";
    }

});

confirmDelete.onclick = async () => {

    if (!selectedRow) return;

    try {

        const id = selectedRow.dataset.id;

        const res = await fetch(`http://localhost:5000/api/contact/${id}`, {
            method: "DELETE"
        });

        const data = await res.json();

        if (data.success) {

            selectedRow.remove();

        }

    } catch (err) {

        console.log(err);

    }

    deletePopup.style.display = "none";

    selectedRow = null;

};


closeView.onclick = () => {
    viewPopup.style.display = "none";
};

cancelDelete.onclick = () => {
    deletePopup.style.display = "none";
};

const logoutBtn = document.getElementById("logoutBtn");

if (logoutBtn) {

    logoutBtn.addEventListener("click", function (e) {

        e.preventDefault();

        if (!confirm("Are you sure you want to logout?")) return;

        localStorage.removeItem("adminLoggedIn");
        localStorage.removeItem("adminToken");
        sessionStorage.clear();

        window.location.replace("admin-login.html");

    });

}

loadContacts();

const pageInfo = document.getElementById("pageInfo");
const prevPage = document.getElementById("prevPage");
const nextPage = document.getElementById("nextPage");

function updatePagination() {

    const totalPages = Math.ceil(allContacts.length / rowsPerPage);

    pageInfo.innerText = `Page ${currentPage} of ${totalPages || 1}`;

    prevPage.disabled = currentPage === 1;
    nextPage.disabled = currentPage === totalPages || totalPages === 0;
}

prevPage.addEventListener("click", () => {

    if (currentPage > 1) {
        currentPage--;
        loadContacts();
    }

});

nextPage.addEventListener("click", () => {

    const totalPages = Math.ceil(allContacts.length / rowsPerPage);

    if (currentPage < totalPages) {
        currentPage++;
        loadContacts();
    }

});


</script>

</body>
</html>
